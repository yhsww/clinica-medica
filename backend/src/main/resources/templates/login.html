<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="#{login.title}">Login — Clínica Médica</title>
    <style>
        :root {
            --primary: #0d6efd;
            --primary-dark: #0a58ca;
            --danger: #dc3545;
            --text: #212529;
            --muted: #6c757d;
            --bg: #f8f9fa;
            --border: #ced4da;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05);
        }
        h1 {
            margin: 0 0 1.5rem;
            font-size: 1.5rem;
            text-align: center;
            color: var(--primary);
        }
        .alert {
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            border-radius: 0.25rem;
            font-size: 0.9rem;
        }
        .alert-danger {
            color: #842029;
            background: #f8d7da;
            border: 1px solid #f5c2c7;
        }
        .alert-info {
            color: #055160;
            background: #d1ecf1;
            border: 1px solid #bee5eb;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.375rem;
            font-weight: 600;
            font-size: 0.9rem;
        }
        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 0.5rem 0.75rem;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: 0.25rem;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
        }
        .btn {
            display: block;
            width: 100%;
            padding: 0.625rem;
            margin-top: 0.25rem;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background: var(--primary);
            border: none;
            border-radius: 0.25rem;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }
        .btn:hover { background: var(--primary-dark); }
        .btn:disabled { opacity: 0.65; cursor: not-allowed; }
        .hint {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--muted);
        }
        .hint a { color: var(--primary); text-decoration: underline; }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
<main class="card">
    <h1>Entrar</h1>

    <div th:if="${param.error}" class="alert alert-danger" role="alert">
        E-mail ou senha inválidos. Tente novamente.
    </div>
    <div th:if="${param.logout}" class="alert alert-info" role="alert">
        Você saiu com sucesso.
    </div>

    <form th:action="@{/login}" method="post" novalidate>
        <div class="form-group">
            <label for="username">E-mail</label>
            <input id="username" name="username" type="email" autocomplete="email"
                   placeholder="seu@email.com" required autofocus/>
        </div>
        <div class="form-group">
            <label for="password">Senha</label>
            <input id="password" name="password" type="password" autocomplete="current-password"
                   required/>
        </div>
        <button class="btn" type="submit">Entrar</button>
    </form>

    <p class="hint">
        Não tem uma conta? <a th:href="@{/cadastro}">Cadastre-se</a>
    </p>
</main>
</body>
</html>
