<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title th:text="#{login.title}">Login — Clínica Médica</title>
    </head>
    <body>
        <main>
            <h1>Entrar</h1>
            <div th:if="${param.error}" role="alert">
                E-mail ou senha inválidos. Tente novamente.
            </div>
            <div th:if="${param.logout}" role="alert">
                Você saiu com sucesso.
            </div>
            <form th:action="@{/login}" method="post" novalidate>
                <div>
                    <label for="username">E-mail</label>
                    <input
                        id="username"
                        name="username"
                        type="email"
                        autocomplete="email"
                        placeholder="seu@email.com"
                        required
                        autofocus
                    />
                </div>
                <div>
                    <label for="password">Senha</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        required
                    />
                </div>
                <button type="submit">Entrar</button>
            </form>
            <p>Não tem uma conta? <a th:href="@{/cadastro}">Cadastre-se</a></p>
        </main>
    </body>
</html>
