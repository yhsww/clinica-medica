name: formatador hihi

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.java'

jobs:
  formatting:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: baixar google-java-format
        run: |
          curl -L -o google-java-format.jar \
            https://github.com/google/google-java-format/releases/download/v1.29.0/google-java-format-1.29.0-all-deps.jar

      - name: formata
        run: |
          find . -name "*.java" -not -path "*/build/*" -not -path "*/target/*" | \
            xargs java -jar google-java-format.jar --replace

      - name: pegar mensagem e autor do commit anterior
        id: last-commit
        run: |
          echo "message=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT
          echo "author=$(git log -1 --pretty=\"%an <%ae>\")" >> $GITHUB_OUTPUT

      - name: commita
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: ${{ steps.last-commit.outputs.message }}
          commit_author: ${{ steps.last-commit.outputs.author }}
          commit_options: '--amend --no-edit'
          push_options: '--force'
          skip_fetch: true
          file_pattern: '*.java'
